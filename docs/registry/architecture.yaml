# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: pixijs_v7_destroy_signature
    status: active
    description: "app.destroy(bool, options) is the PixiJS v7 signature. In v8 use:
      app.destroy({ removeView: true, children: true, texture: false, textureSource: false })"
    why: "v8 changed destroy() to accept a single options object. Using the v7 two-arg form
      silently ignores the second argument — texture/children options are never applied."
    adr: docs/architecture/ADR-006-isometric-rendering.md
    added: "2026-05-16"

  - pattern: pixijs_graphics_overlay_over_cached_layer
    status: active
    description: "Never use a Graphics object as a day/night or color overlay above a
      Container.cacheAsTexture() layer. Use a pre-rendered Sprite with tinted alpha instead."
    why: "A dynamic Graphics child invalidates the texture cache of parent Containers,
      eliminating the draw-call savings of cacheAsTexture on the ground layer."
    adr: docs/architecture/ADR-006-isometric-rendering.md
    added: "2026-05-16"

  - pattern: drizzle_jsonb_without_zod_parse
    status: active
    description: "Never read JSONB columns from Drizzle without a runtime Zod parse.
      .$type<>() provides zero runtime validation — TypeScript types only.
      Required: z.record(z.number()).parse(row.worldState) before using in sim."
    why: "Corrupted DB data bypasses TypeScript types silently. Zod throws at the
      DB boundary with a clear error before bad data reaches the simulation engine."
    adr: docs/architecture/ADR-005-worldstate-persistence.md
    added: "2026-05-16"

  - pattern: tenant_unscoped_delete
    status: active
    description: "DELETE queries on multi-user tables MUST include the owning entity
      ID (playthroughId, userId, clubId) in the WHERE clause. A range-only WHERE
      (e.g. week < N) without tenant scoping deletes across all users silently."
    why: "Multi-tenant data safety. Missing tenant filter is a data loss bug."
    adr: docs/architecture/ADR-005-worldstate-persistence.md
    added: "2026-05-16"

  - pattern: raw_json_type_assertion_at_api_boundary
    status: active
    description: "Never use `as { field: type }` on external API responses (llama-server, third-party HTTP).
      Always parse with Zod before accessing fields."
    why: "Type assertions bypass runtime validation. If the external API returns an error body or
      unexpected shape, the assertion silently succeeds and the undefined/wrong-type field propagates
      through the system. Zod.parse() throws at the boundary with a clear error."
    adr: docs/architecture/ADR-004-narrative-ai-architecture.md
    added: "2026-05-16"

  - pattern: direct_world_state_access
    status: active
    description: "Direct WorldState.get(nodeId) without the getNode() helper is forbidden.
      Always use: getNode(state, nodeId) from cascade-types.ts"
    why: "noUncheckedIndexedAccess:true makes direct .get() return number|undefined.
      Using the helper centralizes the undefined check and produces a clear error
      when a node is missing instead of silent NaN propagation."
    adr: docs/architecture/ADR-003-cascade-graph-topology.md
    added: "2026-05-16"

  - pattern: math_random_in_sim
    status: active
    description: "Math.random() must never be called inside packages/shared/src/sim/.
      Use ctx.rng() from the SimContext passed as parameter."
    why: "Math.random() is non-deterministic. Sim functions must produce identical output
      for the same seed — Math.random() breaks replays, debugging, and client preview."
    adr: docs/architecture/ADR-002-simulation-determinism.md
    added: "2026-05-16"

  - pattern: date_now_in_sim
    status: active
    description: "Date.now() and new Date() must never be called inside packages/shared/src/sim/.
      Use ctx.worldClock (the in-game week number) instead."
    why: "Wall-clock time inside sim logic creates non-determinism. The sim must be
      a pure function of its inputs; time is an input, not a side-channel read."
    adr: docs/architecture/ADR-002-simulation-determinism.md
    added: "2026-05-16"

  - pattern: async_io_in_sim
    status: active
    description: "No await, fetch, DB calls, or file I/O inside packages/shared/src/sim/ functions.
      Load all state before calling sim, persist results after sim returns."
    why: "Async I/O inside sim breaks the pure-function guarantee and makes the sim
      untestable in isolation. The service layer owns load and persist; sim owns computation."
    adr: docs/architecture/ADR-002-simulation-determinism.md
    added: "2026-05-16"

  - pattern: multi_advance_calls_for_skip
    status: active
    description: "The SvelteKit client must never call POST /api/game/advance N times
      to implement skip-to-next-event. A single call returns the correct final state.
      The server determines N internally."
    why: "Calling /advance N times from the client moves the 'what is the next event'
      logic to the client, creates N separate DB transactions (risk of partial state),
      and multiplies HTTP latency. The server is the authority on calendar events."
    adr: docs/architecture/ADR-008-world-clock-event-loop.md
    added: "2026-05-16"

  - pattern: worker_io_import_multiprocess
    status: active
    description: "BullMQ workers must not import the Socket.IO io singleton (from lib/socket.ts)
      if the worker runs in a separate process from the HTTP/Socket.IO server.
      Direct io import only works when worker and server share the same Node.js process.
      Multi-process deployment requires @socket.io/redis-adapter pub/sub."
    why: "In a multi-process setup, io in the worker process is either undefined or a
      disconnected instance. io.to().emit() would silently drop events — no error thrown,
      no message delivered. The startup guard catches this at boot time in-process."
    adr: docs/architecture/ADR-009-staff-message-routing.md
    added: "2026-05-16"

  - pattern: cross_module_clubs_write
    status: active
    description: "No module other than club-service may INSERT or UPDATE rows in the clubs table.
      Other modules (match-sim, economy, transfers, staff) reference clubs via clubId FK and
      may read via SELECT, but must never write clubs rows directly."
    why: "clubs is a shared entity referenced by many modules. Direct writes from multiple
      modules create race conditions and make club state unpredictable. Centralizing writes
      in club-service ensures consistent validation and audit trail."
    adr: docs/architecture/ADR-011-league-competition-schema.md
    added: "2026-05-16"

  - pattern: async_onmount_cleanup
    status: active
    description: "Never pass an async function to Svelte's onMount() if cleanup is needed.
      Use synchronous onMount with .then() for any async init: onMount(() => { task.then(...); return () => cleanup(); })"
    why: "onMount(async () => ...) returns a Promise, not a cleanup function. Svelte treats
      a non-function return as no cleanup. The component will not destroy PixiJS Applications,
      cancel timers, or disconnect Socket.IO listeners on unmount — silently leaking memory."
    adr: docs/architecture/ADR-012-ui-architecture-dom-canvas-frontier.md
    added: "2026-05-16"

  - pattern: stacking_context_in_layout
    status: active
    description: "SvelteKit +layout.svelte files must not apply CSS properties that create
      stacking contexts: transform, filter, will-change, isolation: isolate, or perspective.
      These properties clip z-index values to the layout subtree, breaking the z-layer system
      defined by UI_LAYERS (canvas z-0 through overlay z-50)."
    why: "A stacking context makes z-index relative to the context's parent, not the viewport.
      A layout wrapping the canvas and a panel will make z-50 (overlay) appear below z-0 (canvas)
      from the browser's perspective. No lint error — fails silently in visual testing."
    adr: docs/architecture/ADR-012-ui-architecture-dom-canvas-frontier.md
    added: "2026-05-16"

