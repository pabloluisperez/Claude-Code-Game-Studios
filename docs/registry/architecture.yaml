# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: evaluate_tick_signature
    status: active
    pattern: direct_call
    producer: any-tick-caller
    consumers:
      - cascade-engine
      - match-simulation
    adr: docs/architecture/ADR-003-cascade-graph-topology.md
    signal_signature: "evaluateTick(ctx: SimContext, graph: CascadeGraph, prevState: WorldState, decisions: PlayerDecisions, pending: DelayedEffectsBuffer): TickResult"
    notes: "Pure function. All inputs are prev-state. Never mutates inputs. Returns nextState + newDelayedEffects + log."
    referenced_by:
      - docs/architecture/ADR-003-cascade-graph-topology.md
    added: "2026-05-16"
    revised: ""

  - contract: sport_plugin_interface
    status: active
    pattern: direct_call
    producer: sport-plugin-implementor
    consumers:
      - match-simulation-service
      - cascade-engine (worldStateDeltas)
    adr: docs/architecture/ADR-007-sport-agnostic-match-sim.md
    signal_signature: "SportPlugin.simulateMatch(ctx, home, away, worldState): MatchOutcome"
    notes: "worldStateDeltas is ReadonlyMap<string, number>. winner is always DERIVED from scores.
      New sport = new SportPlugin implementation; engine does not change."
    referenced_by:
      - docs/architecture/ADR-007-sport-agnostic-match-sim.md
    added: "2026-05-16"
    revised: ""

  - contract: sim_function_signature
    status: active
    pattern: direct_call
    producer: any-sim-caller
    consumers:
      - cascade-engine
      - match-simulation
      - economy-tick
    adr: docs/architecture/ADR-002-simulation-determinism.md
    signal_signature: "fn(ctx: SimContext, ...domain-specific-params): DomainResult"
    notes: "All simulation functions in packages/shared/src/sim/ MUST accept SimContext
      as their first argument. No sim function may call Math.random() or Date.now() directly."
    referenced_by:
      - docs/architecture/ADR-002-simulation-determinism.md
    added: "2026-05-16"
    revised: ""

  - contract: advance_api_contract
    status: active
    pattern: direct_call
    producer: game-client (SvelteKit)
    consumers:
      - game-clock-service
    adr: docs/architecture/ADR-008-world-clock-event-loop.md
    signal_signature: "POST /api/game/advance → AdvanceResult { finalWeek, weeksAdvanced, eventsTriggered, thresholdCrossings, nextEventPreview }"
    notes: "Server determines N (weeks to advance) from calendar_events table. Client never
      specifies N. All N ticks processed synchronously in a single DB transaction."
    referenced_by:
      - docs/architecture/ADR-008-world-clock-event-loop.md
    added: "2026-05-16"
    revised: ""

  - contract: threshold_crossing_contract
    status: active
    pattern: direct_call
    producer: cascade-engine (evaluateTick)
    consumers:
      - game-clock-service
    adr: docs/architecture/ADR-008-world-clock-event-loop.md
    signal_signature: "TickResult.thresholdCrossings: ThresholdCrossing[] — each crossing has { nodeId, previousValue, newValue, direction, priority: 'BLOCKING' | 'ADVISORY' }"
    notes: "Extends ADR-003 TickResult type. cascade-engine returns crossings; game-clock-service
      decides whether to stop advance (BLOCKING) or record-and-continue (ADVISORY). Engine has
      no knowledge of calendar or UI — only reports what happened numerically."
    referenced_by:
      - docs/architecture/ADR-008-world-clock-event-loop.md
      - docs/architecture/ADR-003-cascade-graph-topology.md
    added: "2026-05-16"
    revised: ""

  - contract: staff_messages_socket_event
    status: active
    pattern: rpc
    producer: staff-messages-worker (BullMQ)
    consumers:
      - sveltekit-client (inbox panel)
    adr: docs/architecture/ADR-009-staff-message-routing.md
    signal_signature: "Socket.IO event 'staff:messages-ready' → StaffMessagesReadyEvent { playthroughId, week, messages: StaffMessage[] } emitted to room 'playthrough:{playthroughId}'"
    notes: "Worker runs in-process with Socket.IO server. Multi-process deployment requires
      @socket.io/redis-adapter pub/sub instead of direct io import. Startup guard enforced."
    referenced_by:
      - docs/architecture/ADR-009-staff-message-routing.md
    added: "2026-05-16"
    revised: ""

  - contract: staff_message_job_contract
    status: active
    pattern: event_bus
    producer: game-clock-service (advance)
    consumers:
      - staff-messages-worker
    adr: docs/architecture/ADR-009-staff-message-routing.md
    signal_signature: "BullMQ queue 'staff-messages' job 'generate' → StaffMessageJobData { playthroughId, finalWeek, season, thresholdCrossings, worldStateDiff }"
    notes: "Enqueued fire-and-forget after advance() DB transaction commits. advance() does not
      await the job. Delivery is async — player receives messages ~500ms after advance response."
    referenced_by:
      - docs/architecture/ADR-009-staff-message-routing.md
      - docs/architecture/ADR-008-world-clock-event-loop.md
    added: "2026-05-16"
    revised: ""

  - contract: p1_p3_resolution_contract
    status: active
    pattern: direct_call
    producer: manager-rpg-service
    consumers:
      - staff-service (hire marketplace)
    adr: docs/architecture/ADR-010-manager-rpg-progression.md
    signal_signature: "getMaxHirableStaffQuality(reputationLevel: number): 1 | 2 | 3 — pure function exported from packages/shared/src/types/manager-rpg.ts"
    notes: "This is the P1↔P3 architectural resolution. Cascade visibility expands ONLY via
      this path: reputation.level → getMaxHirableStaffQuality() → qualityTier (ADR-009) →
      perception threshold → more staff messages. The UI must never expose cascade formulas directly."
    referenced_by:
      - docs/architecture/ADR-010-manager-rpg-progression.md
      - docs/architecture/ADR-009-staff-message-routing.md
    added: "2026-05-16"
    revised: ""

  - contract: update_standings_after_match
    status: active
    pattern: direct_call
    producer: game-clock-service (advance, match event)
    consumers:
      - league-service
    adr: docs/architecture/ADR-011-league-competition-schema.md
    signal_signature: "league-service.updateStandingsAfterMatch(tx, fixture: FixtureRecord, outcome: MatchOutcome): Promise<void>"
    notes: "Called within the advance() DB transaction after SportPlugin.simulateMatch() resolves.
      Must be in the same transaction as snapshot + currentWeek update for atomicity."
    referenced_by:
      - docs/architecture/ADR-011-league-competition-schema.md
      - docs/architecture/ADR-007-sport-agnostic-match-sim.md
    added: "2026-05-16"
    revised: ""

