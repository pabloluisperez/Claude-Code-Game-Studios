# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-05-16"  # ADR-008..012: + dom_canvas_frontier, async_onmount_cleanup, stacking_context_in_layout

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: playthrough_save_game
    status: active
    owner_system: playthrough-service
    adr: docs/architecture/ADR-005-worldstate-persistence.md
    interface: "Single autosave per user. loadCurrentWorldState(playthroughId) → WorldState + DelayedEffectsBuffer + week"
    write_access: cascade-tick-service-only
    referenced_by:
      - docs/architecture/ADR-005-worldstate-persistence.md
    added: "2026-05-16"
    revised: ""

  - state: cascade_world_state
    status: active
    owner_system: cascade-engine
    adr: docs/architecture/ADR-003-cascade-graph-topology.md
    interface: "WorldState = Map<NodeId, number> — read via getNode(state, id), written only by evaluateTick()"
    write_access: cascade-engine-only   # no other system writes WorldState directly
    referenced_by:
      - docs/architecture/ADR-003-cascade-graph-topology.md
    added: "2026-05-16"
    revised: ""

  - state: current_week
    status: active
    owner_system: game-clock-service
    adr: docs/architecture/ADR-008-world-clock-event-loop.md
    interface: "playthroughs.currentWeek (integer) — incremented only by game-clock-service.advance(). Read via GET /api/game/state or returned in AdvanceResult."
    write_access: game-clock-service-only   # advance() is the sole incrementer
    referenced_by:
      - docs/architecture/ADR-008-world-clock-event-loop.md
    added: "2026-05-16"
    revised: ""

  - state: manager_skills
    status: active
    owner_system: manager-rpg-service
    adr: docs/architecture/ADR-010-manager-rpg-progression.md
    interface: "manager_profiles.skills (JSONB) = Record<ManagerSkillId, ManagerSkill>. Updated only by manager-rpg-service.applyXpGrants(). Read via managerRepo.findByPlaythrough()."
    write_access: manager-rpg-service-only   # applyXpGrants() is the sole writer
    referenced_by:
      - docs/architecture/ADR-010-manager-rpg-progression.md
    added: "2026-05-16"
    revised: ""

  - state: clubs_entity
    status: active
    owner_system: club-service
    adr: docs/architecture/ADR-011-league-competition-schema.md
    interface: "clubs table — read freely; writes ONLY via club-service. Other modules (match-sim, economy, transfers) reference clubId as FK but never INSERT/UPDATE clubs rows directly."
    write_access: club-service-only
    referenced_by:
      - docs/architecture/ADR-011-league-competition-schema.md
    added: "2026-05-16"
    revised: ""

