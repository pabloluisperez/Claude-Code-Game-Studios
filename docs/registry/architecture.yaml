# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: world_state_type
    status: active
    api: "Map<NodeId, number> via getNode(state, id) helper"
    not: "Record<NodeId, number> — causes number|undefined with noUncheckedIndexedAccess:true"
    adr: docs/architecture/ADR-003-cascade-graph-topology.md
    reason: "Map avoids noUncheckedIndexedAccess widening. getNode() provides a single safe access point with a clear error message when a node is missing."
    referenced_by:
      - docs/architecture/ADR-003-cascade-graph-topology.md
    added: "2026-05-16"
    revised: ""

  - purpose: llm_server_url_format
    status: active
    api: "http://127.0.0.1:8080 (NOT http://localhost:8080)"
    not: "http://localhost:8080 — Node.js 22 may resolve localhost to ::1 (IPv6) causing ECONNREFUSED if llama-server only listens on IPv4"
    adr: docs/architecture/ADR-004-narrative-ai-architecture.md
    reason: "IPv4/IPv6 ambiguity in Node.js 22+ where localhost preferentially resolves to ::1"
    referenced_by:
      - docs/architecture/ADR-004-narrative-ai-architecture.md
    added: "2026-05-16"
    revised: ""

  - purpose: simulation_prng
    status: active
    api: "seedrandom(seed, { state: false }) from 'seedrandom' npm package"
    not: "Math.random() — explicitly banned inside packages/shared/src/sim/"
    adr: docs/architecture/ADR-002-simulation-determinism.md
    reason: "Battle-tested, isomorphic (Node + browser), correct distribution for game
      simulations, TypeScript types via @types/seedrandom. { state: false } avoids Vite SSR gotcha."
    referenced_by:
      - docs/architecture/ADR-002-simulation-determinism.md
    added: "2026-05-16"
    revised: ""

  - purpose: manager_skills_storage
    status: active
    api: "JSONB column manager_profiles.skills: Record<ManagerSkillId, ManagerSkill>"
    not: "WorldState nodes (Map<NodeId, number>) — manager skills are discrete structured levels, not continuous cascade values"
    adr: docs/architecture/ADR-010-manager-rpg-progression.md
    reason: "Manager skills are structured (named, leveled, XP-tracked) domain data, not
      cascade numeric values. Storing as WorldState nodes would couple cascade engine to RPG
      progression and force discrete enum values into a continuous numeric space."
    referenced_by:
      - docs/architecture/ADR-010-manager-rpg-progression.md
    added: "2026-05-16"
    revised: ""

  - purpose: dom_canvas_frontier
    status: active
    api: "Canvas (PixiJS 8) for world rendering; DOM (Svelte 5) for all management UI"
    not: "PixiJS for UI panels/forms/tables; DOM for world tiles/sprites/animations"
    adr: docs/architecture/ADR-012-ui-architecture-dom-canvas-frontier.md
    reason: "Management game requires complex forms, tables, and accessible UI. PixiJS canvas
      excels at 60fps sprite rendering. Separation gives each tool its optimal use case.
      Z-index system: canvas z-0, HUD z-10, panels z-20, modals z-30, toasts z-40, overlay z-50."
    referenced_by:
      - docs/architecture/ADR-012-ui-architecture-dom-canvas-frontier.md
      - docs/architecture/ADR-006-isometric-rendering.md
    added: "2026-05-16"
    revised: ""

