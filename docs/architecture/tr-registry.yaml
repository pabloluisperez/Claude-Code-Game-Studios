# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by with
#     the new TR-ID(s).
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#
# ID FORMAT: TR-[system-slug]-[NNN]
#   system-slug = short slug matching the GDD system name
#   NNN = three-digit zero-padded sequence per system, starting at 001
#
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

version: 1
last_updated: "2026-05-19"

requirements:

  # ── player-management ─────────────────────────────────────────────────────

  - id: TR-PM-001
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "players table (normalised, per-row) with composite index (playthroughId, clubId); PlayersRepo with findByClub, createPlayers, updatePlayer, getSquadAvailabilityCount"
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-002
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "F1 computeSkill: position-weighted mean of position stats — GK reflexes×0.40+handling×0.35+kicking×0.25; DEF tackling×0.40+strength×0.35+positioning×0.25; MID passing×0.35+vision×0.35+workRate×0.30; FWD finishing×0.45+speed×0.30+dribbling×0.25. Output clamped [20,95]."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-003
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "generateRoster: deterministic generation of 40 players per club (4 GK, 12 DEF, 12 MID, 12 FWD) from ctx.rng() seed. Age distribution 30% young/50% peak/20% veteran. Same seed → identical roster."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-004
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "F4 form rolling: exponentially-weighted average of last 5 match_ratings (weights [1.0, 0.85, 0.7, 0.55, 0.4] most-recent-first), clamped [30,90]. F5 form decay: -2/week after 5-week grace period without playing, floor at MIN_FORM=30."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-005
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "Player status transitions: available→injured (injury event, recovery=rng(1-6) weeks), injured→available (recovery_weeks=0), available→suspended (red card, 1 week). F7 fitness: post-match decay = FITNESS_DECAY_MAX×(min/90)×(1-stamina/100); weekly recovery = +8 when no match. Both clamped [0,100]."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-006
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "F8 squad_available_pct = round(available_count/SQUAD_REGISTERED_SIZE×100) with SQUAD_REGISTERED_SIZE=25 (canonical denominator from league-system). F9 team_skill = round(mean(skill of starting 11)). F9b player_happiness_delta = round(mean(morale of starting 11)) - prevState.player_happiness. All pushed as PlayerDecisions in cascade Step 3."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-007
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "F10 market_wage = transfer_value × WAGE_VALUE_RATIO(0.02). F11 morale delta = result_bonus(±3/0/−2) + wage_ratio_bonus(±2/0/−3) + playing_time_bonus(+1/0/−1). morale_next = clamp(morale + delta, 0, 100)."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-008
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "F12 end-of-season: for age≥30, decay=min(SKILL_DECAY_MAX=2, floor((age-29)/2)); skill=max(20,skill-decay). Weekly micro-decay (ADR-016): age<28→0; 28-29→-0.05/wk; 30-31→-0.1; 32-33→-0.2; 34+→-0.4. Development for age<30: if minutes_season/max_season≥0.40 and skill<potentialCeiling: skill+=min(2,potentialCeiling-skill)."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-009
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "F6 transfer_value_eur_k = BASE_VALUE_K(5.0) × skill_factor((skill/50)^1.8) × age_factor(discrete table) × form_factor(0.8+(form-60)/100×0.4). Minimum clamp 0.1 €K."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-010
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "Transfer market: buy at offer≥transfer_value×0.9 within transfer_window; sell when AI offer≥threshold and manager accepts. Operations rejected with 'market_closed' outside window. Wrapped in Drizzle transaction."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-PM-011
    system: player-management
    gdd: design/gdd/player-management.md
    requirement: "Contract renewal: players with contractEndWeek≤currentWeek+8 trigger ContractRenewalOffer STOP event at season_end. Accept→update salary+contractEnd; Decline→availability='leaving'; Counter→accept if ≤market_wage×1.5, else decline. Default timeout=decline."
    created: "2026-05-19"
    revised: ""
    status: active

  # ── league-system ─────────────────────────────────────────────────────────

  - id: TR-LGS-001
    system: league-system
    gdd: design/gdd/league-system.md
    requirement: "5 Drizzle tables (leagues, divisions, seasons, fixtures, standings) with FK constraints + composite indexes per ADR-011. UNIQUE (season_id, week, home_club_id) on fixtures."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-LGS-002
    system: league-system
    gdd: design/gdd/league-system.md
    requirement: "generateRoundRobin: deterministic double round-robin — 20 clubs × 38 matchdays × 10 matches = 380 fixtures. Each pair × 2. No self-match. Same inputs → identical output."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-LGS-003
    system: league-system
    gdd: design/gdd/league-system.md
    requirement: "Standings sort canonical order: points DESC → goal_diff DESC → goals_for DESC → head-to-head → derby +1 tiebreaker. Pure function."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-LGS-004
    system: league-system
    gdd: design/gdd/league-system.md
    requirement: "applyMatchToStandings: post-match transactional update. Win=+3, draw=+1, loss=0. Both clubs updated atomically. Idempotent on fixture_id."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-LGS-005
    system: league-system
    gdd: design/gdd/league-system.md
    requirement: "processSeasonEnd: top 3 D2→D1, bottom 3 D1→D2. New seasons + new round-robin fixtures. Player contracts on relegated clubs trigger renewal events. Atomic Drizzle tx."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-LGS-006
    system: league-system
    gdd: design/gdd/league-system.md
    requirement: "Forfeit handler at fixture-load time: if squad_available_pct ≤ 63 (denom SQUAD_REGISTERED_SIZE=25), synthesize MatchOutcome 0-3 + mpi_delta=-30 + emit forfeit_recorded event."
    created: "2026-05-19"
    revised: ""
    status: active

  - id: TR-LGS-007
    system: league-system
    gdd: design/gdd/league-system.md
    requirement: "Derby detection: isDerby = same city. Rival club identification: first same-city club (lexicographic tiebreak). Used by standings sort + event-system."
    created: "2026-05-19"
    revised: ""
    status: active

  # ── tv-rights ──────────────────────────────────────────────────────────────

  - id: TR-TVR-001
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "tv_contracts Drizzle table (NOT WorldState JSON): id, playthroughId FK, seasonId, tier ('LOCAL'|'REGIONAL'|'NACIONAL'), durationSeasons ∈ {1,2,3}, seasonInContract ∈ [1..durationSeasons], weeklyRateEurK numeric(10,2), divisionAtSigning ('D1'|'D2'), status FSM (NONE|ACTIVE|CANCELLED|EXPIRED), signedAt/cancelledAt/cancelledReason. UNIQUE (playthroughId, seasonId). fan_loyalty INTEGER NOT NULL DEFAULT 0 column on managers table, range [0,50]."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-002
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "F-TV1: calculateTVRate(tier, division, durationSeasons) = Math.round(TV_BASE_CENTS[tier] × DIVISION_MULTIPLIER_CENTS[div] × DURATION_MULTIPLIER_CENTS[dur] / 10000) / 100. Guards: RangeError → HTTP 400 for division∉{D1,D2}, duration∉{1,2,3}, illegal combos (LOCAL 2yr/3yr, REGIONAL 3yr, NACIONAL 2yr). Results: LOCAL D2=0.53, REGIONAL D2=1.75, NACIONAL D1=7.16, REGIONAL 2yr D2=1.84, NACIONAL 3yr D1=7.87."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-003
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "tv_auction STOP event at season_start (scheduled_week=0, consumed=false). Unlock rules: LOCAL always; REGIONAL if D2 prev_pos≤10 OR rep≥2 OR D1 actual; NACIONAL if D1 actual OR rep≥4. Blocked if corruption_exposure≥60 (REGIONAL+NACIONAL unavailable). T1 (prev_season_final_position=null) = only LOCAL. advance() blocked while tv_auction consumed=false (HTTP 409 on /advance). TVAuctionPayload variant extends ADR-015 union."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-004
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "F-TV3 8-step Tick Order within advance(): (1) prevCorruptionTV; (2) delta=LOCAL:-0.5/REGIONAL:+0.5/NACIONAL:+1.5, clamp [0,CORRUPTION_MAX=100] via roundCorruption(); (3) threshold_crossed_upward_tv (prev<60 AND new≥60); (4) if crossed→CANCELLED+midseason if week≤35; (5) revenue=rate if ACTIVE else 0; (6) cascade injects externalDelta via roundCorruption(); (7) threshold_crossed_upward_cascade; (8) if crossed→CANCELLED. Revenue asymmetry: F-TV3 cancel = revenue 0 (paso 4 before paso 5); cascade cancel = revenue preserved (paso 8 after paso 5)."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-005
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "F-TV2 tv_midseason_offer: STOP event generated if cancellation AND current_week≤35. tier=TIER_BELOW[cancelled_tier] ({NACIONAL→REGIONAL, REGIONAL→LOCAL, LOCAL→LOCAL}). rate=Math.round(TV_BASE_CENTS[midTier]×DIVISION_MULTIPLIER_CENTS[currentDiv]×70/10000)/100. Always duration_seasons=1. Idempotent: UNIQUE partial index on calendar_events (playthrough_id, season_id, type) WHERE type IN ('tv_auction','tv_midseason_offer')."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-006
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "Multi-year rollover: on season_end if season_in_contract < duration_seasons → season_in_contract+=1, no tv_auction generated, weekly_rate_eur_k immutable (division_at_signing). On season_end if season_in_contract=duration_seasons → ACTIVE→EXPIRED, next season_start generates tv_auction. CANCELLED on season_end = no-op; CANCELLED→NONE on season_start. Cancellation annuls remaining multi-year seasons. Corruption does NOT reset on rollover."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-007
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "F-TV4 fan_loyalty → fan_attendance_effective: min(1.0, fan_attendance × (1 + fan_loyalty × 0.005)). Fan loyalty +10 on rejecting tv_auction (NONE, AC-TV-21) or tv_midseason_offer (CANCELLED, AC-TV-24). Cap 50. BREAKING CHANGE: matchday revenue consumers must apply F-TV4 (pending OQ-TV-03 cross-review — location: economy §F3 or cascade C8). fan_loyalty registered in entities.yaml before implementation."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-008
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "XP grants on tv_auction resolution: signing REGIONAL → financial_acumen_xp +10; signing NACIONAL → financial_acumen_xp +25; signing LOCAL → no change; rejection → no XP change. Granted inside POST /api/tv/sign transaction."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-009
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "TV revenue in cashflow: tv_weekly_eur_k = contract.weekly_rate_eur_k if ACTIVE else 0. Replaces economy.md §F2 flat constant. BREAKING CHANGE: delete getTVRightsWeekly() from league-system module + constants TV_RIGHTS_SEGUNDA/TV_RIGHTS_PRIMERA from constants.ts. ACs AC-LGS-18/19 deprecated."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-010
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "TV_SCANDAL_THRESHOLD=60 cancellation: threshold_crossed_upward_tv (paso 3, F-TV3 delta) or threshold_crossed_upward_cascade (paso 7, after cascade injection). Revenue asymmetry: F-TV3 cancellation tick revenue=0 (cancel in paso 4, before revenue paso 5); cascade cancellation tick revenue=ACTIVE rate (cancel in paso 8, after revenue paso 5). Week 38: CANCELLED (not EXPIRED) if threshold crossed; season_end treats CANCELLED as no-op."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-011
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "UI in /finance: active contract panel (tier, channel name, weekly rate, weeks remaining, 'Year N of M' for multi-year); tv_auction offers list (tier+duration, weekly_rate, corruption_delta, risk flags ⚠️ NACIONAL 3yr corruption>0 and REGIONAL 2yr corruption≥22); tv_midseason_offer display (tier, 70% rate, weeks remaining). UX spec: design/ux/tv-rights.md (pending /ux-design tv-rights)."
    created: "2026-05-20"
    revised: ""
    status: active

  - id: TR-TVR-012
    system: tv-rights
    gdd: design/gdd/tv-rights.md
    requirement: "POST /api/tv/sign: validate tier+durationSeasons (HTTP 400 for illegal combos), reject if tv_contract_status=ACTIVE (HTTP 409), calculate F-TV1 rate, resolve tv_auction event (consumed=true), create tv_contract ACTIVE — all in single Drizzle transaction. Also: POST /api/tv/reject: set event consumed=true, fan_loyalty+=10 (min(50,X+10)), no contract created. Both guarded by session auth."
    created: "2026-05-20"
    revised: ""
    status: active
