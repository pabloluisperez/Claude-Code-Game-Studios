# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: fan_momentum_blocking_threshold_low
    status: active
    source: design/gdd/cascade-engine.md
    referenced_by:
      - design/gdd/cascade-engine.md
      - design/gdd/hud-ui.md
    value: 20
    unit: "fan_momentum units [0-100]"
    notes: "Cuando fan_momentum cae por debajo de 20, se genera un ThresholdCrossing BLOCKING que para el advance loop y fuerza un board meeting. Event-system.md y hud-ui.md deben referenciar este valor."
    added: "2026-05-17"
    revised: ""
  - name: player_happiness_blocking_threshold_low
    status: active
    source: design/gdd/cascade-engine.md
    referenced_by:
      - design/gdd/cascade-engine.md
    value: 25
    unit: "player_happiness units [0-100]"
    notes: "Cuando player_happiness cae por debajo de 25, se genera un ThresholdCrossing BLOCKING que para el advance loop y fuerza una reunión con el capitán. Event-system.md debe referenciar este valor."
    added: "2026-05-17"
    revised: ""
  - name: corruption_exposure_blocking_threshold_high
    status: active
    source: design/gdd/cascade-engine.md
    referenced_by:
      - design/gdd/cascade-engine.md
      - design/gdd/economy.md
    value: 80
    unit: "corruption_exposure units [0-100]"
    notes: "Cuando corruption_exposure supera 80, se genera un ThresholdCrossing BLOCKING de escándalo. El impacto en fan_momentum es SCANDAL_FAN_IMPACT=30. Economy.md usa este umbral como trigger para F8."
    added: "2026-05-17"
    revised: ""
  - name: scandal_fan_impact
    status: active
    source: design/gdd/cascade-engine.md
    referenced_by:
      - design/gdd/cascade-engine.md
      - design/gdd/economy.md
    value: 30
    unit: "fan_momentum points"
    notes: "Caída de fan_momentum cuando se descubre un escándalo de corrupción. Economy.md modela el impacto económico adicional (multa F8 + cancelación de patrocinador)."
    added: "2026-05-17"
    revised: ""
  - name: cascade_node_default_range
    status: active
    source: design/gdd/cascade-engine.md
    referenced_by:
      - design/gdd/cascade-engine.md
    value: "[0, 100]"
    unit: "unitless [0-100] normalizado"
    notes: "Todos los nodos del WorldState de cascade-engine tienen rango [0, 100] salvo consecutive_wins/losses [0-10]. Cualquier GDD que defina un nuevo nodo debe seguir esta convención. ADR-003 implementa este rango como parámetro en CascadeNodeDef."
    added: "2026-05-17"
    revised: ""
  - name: squad_available_pct_minimum_threshold
    status: active
    source: design/gdd/match-simulation.md
    referenced_by:
      - design/gdd/match-simulation.md
      - design/gdd/player-management.md
    value: 63
    unit: "squad_available_pct units [0-100]"
    notes: "Cuando squad_available_pct cae a 63 o menos (7 o menos jugadores disponibles de 11), el partido no puede disputarse — se registra como derrota por incomparecencia (0-3). Player-management debe asegurar que el squad siempre supere este umbral antes del día de partido. League-system aplica la regla de forfeit."
    added: "2026-05-17"
    revised: ""
  - name: fitness_decay_max
    status: active
    source: design/gdd/match-simulation.md
    referenced_by:
      - design/gdd/match-simulation.md
      - design/gdd/player-management.md
    value: 15
    unit: "fitness points"
    notes: "Pérdida máxima de fitness efectiva al final del partido (minuto 90) para un jugador con stamina=0. Jugadores con stamina=100 no pierden fitness durante el partido. Player-management usa este valor para modelar la fatiga post-partido junto con los minutos jugados."
    added: "2026-05-17"
    revised: "2026-05-18"
  - name: injury_risk_per_injury
    status: active
    source: design/gdd/match-simulation.md
    referenced_by:
