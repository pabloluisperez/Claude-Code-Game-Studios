      - design/gdd/player-management.md
    value: 5
    unit: "injury_risk points"
    notes: "Incremento de injury_risk (WorldState node) por cada lesión ocurrida durante el partido. El cascade-engine debe calibrar su decay semanal de injury_risk teniendo en cuenta este valor — si el decay es <5 por semana, un partido con lesiones mantiene el riesgo elevado crónicamente."
    added: "2026-05-17"
    revised: ""
  - name: match_pause_timeout_hours
