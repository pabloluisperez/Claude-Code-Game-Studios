# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: fan_momentum_asymmetric_hysteresis
    status: active
    source: design/gdd/cascade-engine.md
    referenced_by:
      - design/gdd/cascade-engine.md
    variables:
      - match_performance_index
      - K_win_base
      - K_loss_base
      - P_win
      - P_loss
    output_range: [-16, 5.5]
    expression: "Si MPI>=50: K_win_base * ln(1 + (MPI-50)/50) / Si MPI<50: -K_loss_base * (1 + ((50-MPI)/50)^2)"
    notes: "La asimetría fundamental del sistema. K_win_base=8, K_loss_base=8. Ratio K_loss/K_win = 1.0 post-R4 (2026-05-18). La asimetría persiste por diferencia de forma (logarítmica vs cuadrática) — derrota equivalente cuesta ~3.4× más que una victoria. Peor caso (MPI=0): -8×(1+1)=-16. Mejor caso (MPI=100): +8×ln(2)≈+5.5. (R4 2026-05-18: K_loss_base corregido de 10→8 — validación cuantitativa mostró que ratio 1.25 producía crisis crónica con 50% WR incluso con recovery paths activas.)"
    added: "2026-05-17"
    revised: "2026-05-18"
  - name: fan_attendance_price_momentum_interaction
    status: active
    source: design/gdd/cascade-engine.md
    referenced_by:
      - design/gdd/cascade-engine.md
      - design/gdd/economy.md
    variables:
      - fan_momentum
      - ticket_price_index
      - ATTEND_MAX_BASE
      - ATTEND_MIN_BASE
      - MOMENTUM_TOLERANCE_DIVISOR
      - PRICE_BONUS_K
    output_range: [0, 100]
    expression: "attendance_target = (fan_momentum/100 * 60 + 5) + max(0, 50-TPI)*0.25 - max(0, TPI-50)*(1-fan_momentum/120)"
    notes: "El fan_momentum modula la sensibilidad al precio. Economy.md usa fan_attendance como input para el cálculo de revenue del partido."
    added: "2026-05-17"
    revised: ""
  - name: effective_rating
    status: active
    source: design/gdd/match-simulation.md
    referenced_by:
      - design/gdd/match-simulation.md
      - design/gdd/player-management.md
    variables:
      - skill
      - form
      - morale
      - effective_fitness
    output_range: [13, 96]
    expression: "skill*0.35 + form*0.20 + morale*0.15 + effective_fitness(player,t)*0.30"
    notes: "Rating compuesto de un jugador en el minuto t del partido. Depende de F1 (effective_fitness). Player-management debe conocer esta fórmula para calcular el match_rating individual post-partido y actualizar el rolling average de 'form'. Rango [13,96] con inputs reales de player-management.md (skill∈[20,95], form∈[30,90], morale∈[0,100], effective_fitness∈[0,100])."
    added: "2026-05-17"
    revised: ""
  - name: match_day_revenue
    status: active
    source: design/gdd/economy.md
    referenced_by:
      - design/gdd/economy.md
      - design/gdd/hud-ui.md
    variables:
      - fan_attendance
      - STADIUM_CAPACITY_BASE
      - ticket_price_eur
      - is_home_match
    output_range: [0, 21.6]
    expression: "(fan_attendance / 100) × STADIUM_CAPACITY_BASE × ticket_price_eur / 1000 × is_home_match"
    notes: "Revenue de taquilla en €K por partido. D3 defaults: capacity=3000, ticket_price_base=8€. 0 en partidos visitantes. Economy es el owner; hud-ui.md lo muestra al jugador."
    added: "2026-05-17"
    revised: ""
  - name: financial_state_thresholds
    status: active
    source: design/gdd/economy.md
    referenced_by:
      - design/gdd/economy.md
      - design/gdd/event-system.md
      - design/gdd/hud-ui.md
    variables:
      - WARNING_BUFFER_WEEKS
      - CRITICAL_BUFFER_WEEKS
      - weekly_total_costs_eur_k
    output_range: [0, 9999]
    expression: "WARNING = 7 × weekly_total_costs; CRITICAL = 3 × weekly_total_costs"
    notes: "Umbrales dinámicos (relativos a costes). WARNING_BUFFER_WEEKS=7, CRITICAL_BUFFER_WEEKS=3. Event-system debe recibir ThresholdCrossings de estos umbrales. hud-ui.md muestra el estado resultante."
    added: "2026-05-17"
    revised: ""
  - name: emergency_loan
    status: active
    source: design/gdd/economy.md
    referenced_by:
      - design/gdd/economy.md
      - design/gdd/event-system.md
    variables:
      - loan_amount_eur_k
      - base_interest_rate
      - LOAN_PENALTY_MULTIPLIER
      - loan_number
      - LOAN_REPAYMENT_WEEKS
    output_range: [0, 9999]
    expression: "effective_rate = 0.15 × 2^(loan_n-1); weekly_repayment = loan × (1+effective_rate) / 10"
    notes: "Préstamo de emergencia escalante. base_interest_rate=0.15, LOAN_PENALTY_MULTIPLIER=2.0, LOAN_REPAYMENT_WEEKS=10. Event-system gestiona la presentación al jugador."
    added: "2026-05-17"
    revised: ""
  - name: scandal_economic_impact
    status: active
    source: design/gdd/economy.md
    referenced_by:
      - design/gdd/economy.md
      - design/gdd/event-system.md
    variables:
      - corruption_exposure
      - SCANDAL_FINE_BASE_EUR_K
      - FINE_SEVERITY_FACTOR
    output_range: [30, 50]
    expression: "scandal_fine_eur_k = 30 × (1 + FINE_SEVERITY_FACTOR × (corruption_exposure − 80) / 20)"
    notes: "SCANDAL_FINE_BASE_EUR_K=30 €K. Solo cancela el slot de camiseta (no estadio) en MVP. Complementa el cascade scandal_fan_impact=-30 definido en cascade-engine.md."
    added: "2026-05-17"
    revised: ""
  - name: mpi_bonus_tactical_insight
    status: active
    source: design/gdd/manager-rpg.md
    referenced_by:
      - design/gdd/manager-rpg.md
      - design/gdd/cascade-engine.md
    variables:
      - tactical_insight_level
    output_range: [0, 5]
    expression: "[0, 1, 2, 3, 5][tactical_insight_level - 1]"
    notes: "Bonus sobre match_performance_index aplicado como implicit PlayerDecision en Paso 3 del cascade tick, solo en semanas con partido. Niveles: L1=0, L2=+1, L3=+2, L4=+3, L5=+5."
    added: "2026-05-17"
    revised: ""
  - name: happiness_bonus_man_management
    status: active
    source: design/gdd/manager-rpg.md
    referenced_by:
      - design/gdd/manager-rpg.md
      - design/gdd/cascade-engine.md
    variables:
      - man_management_level
    output_range: [0, 4]
    expression: "[0, 1, 2, 3, 4][man_management_level - 1]"
    notes: "Bonus semanal sobre player_happiness aplicado como implicit PlayerDecision en Paso 3, cada semana (con o sin partido). Niveles: L1=0, L2=+1, L3=+2, L4=+3, L5=+4."
    added: "2026-05-17"
    revised: ""
  - name: fa_multiplier_financial_acumen
    status: active
    source: design/gdd/manager-rpg.md
    referenced_by:
      - design/gdd/manager-rpg.md
      - design/gdd/economy.md
    variables:
      - financial_acumen_level
      - LEVEL_MODIFIER_base
    output_range: [1.00, 1.12]
    expression: "[1.00, 1.03, 1.06, 1.09, 1.12][financial_acumen_level - 1] × LEVEL_MODIFIER_base"
    notes: "Multiplicador aplicado sobre LEVEL_MODIFIER de F3 (economy.md) en el momento de firma de contratos de patrocinio. Solo aplica a nuevas firmas — contratos activos mantienen el multiplicador del momento de su firma."
    added: "2026-05-17"
    revised: ""
  - name: sn_multiplier_scouting_network
    status: active
    source: design/gdd/manager-rpg.md
    referenced_by:
      - design/gdd/manager-rpg.md
      - design/gdd/cascade-engine.md
    variables:
      - scouting_network_level
      - K_scouting_base
    output_range: [15.0, 21.0]
    expression: "[1.00, 1.10, 1.20, 1.28, 1.40][scouting_network_level - 1] × K_scouting_base"
    notes: "Modifica la constante K_scouting de C9a (cascade-engine.md). effective_K_scouting = K_scouting_base × sn_multiplier. K_scouting_base=15.0. Con L5 y budget=30: equilibrio scouting_points≈78 (vs 56 en L1)."
    added: "2026-05-17"
    revised: ""
  - name: getMaxHirableStaffQuality
    status: active
    source: design/gdd/manager-rpg.md
    referenced_by:
      - design/gdd/manager-rpg.md
      - design/gdd/staff-system.md
    variables:
      - reputation_level
    output_range: [1, 3]
    expression: "reputation_level >= 4 → 3; reputation_level >= 3 → 2; else → 1"
    notes: "Pure function — la resolución arquitectónica de Pilar 1↔Pilar 3. Gatea la calidad máxima de staff contratables. Reputation L1-2=tier1, L3=tier2, L4-5=tier3. Definida en ADR-010 como pure function usable en servidor y cliente."
    added: "2026-05-17"
    revised: ""
  - name: effectiveThreshold
    status: active
    source: design/gdd/staff-system.md
    referenced_by:
      - design/gdd/staff-system.md
    variables:
      - BASE_THRESHOLD_PCT
      - qualityTier
    output_range: [0.02, 0.06]
    expression: "BASE_THRESHOLD_PCT × QUALITY_FACTOR[qualityTier]; QUALITY_FACTOR = {1:3.0, 2:1.5, 3:1.0}"
    notes: "Umbral de percepción efectivo por tier a defaults (BASE=0.02). T1=0.06(6pts), T2=0.03(3pts), T3=0.02(2pts). Todos los umbrales usan comparación ≥. Revisado 2026-05-18: output_range corregido de [0.04,0.12]→[0.02,0.06] al corregir BASE_THRESHOLD_PCT."
    added: "2026-05-17"
    revised: "2026-05-18"

